name: release

# Each push to main runs release-please, which opens or updates a release PR
# from the conventional-commit history. Merging that PR tags v<version> and
# creates the GitHub release; the jobs below then build the plugin archives the
# Tracon contract names, <name>-<version>-<target>.tar.gz holding
# tracon-plugin.toml and bin/sql-review, and attach them with checksums.txt.
on:
  push:
    branches: [main]
  # Re-run the artefact jobs for a release that already exists, when a build or
  # an upload failed part way. Nothing here re-tags.
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Two merges landing seconds apart could each see no open release PR and
    # both open one. Pushes to main take this job one at a time; the workflow
    # itself has no group, which would let a later merge drop a queued
    # release's artefact jobs. A manual re-run gets a group of its own.
    concurrency:
      group: ${{ github.event_name == 'push' && 'release-please' || format('release-please-dispatch-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.out.outputs.release_created }}
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: github.event_name == 'push'
        id: rp
        with:
          # A PR opened with GITHUB_TOKEN gets no CI run until someone approves
          # it by hand, and the release PR has required checks. This token opens
          # it as a user instead. Without the secret it falls back to
          # GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: out
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_CREATED: ${{ steps.rp.outputs.release_created }}
          TAG_NAME: ${{ steps.rp.outputs.tag_name }}
          VERSION: ${{ steps.rp.outputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            {
              echo "release_created=true"
              echo "tag=$INPUT_TAG"
              echo "version=${INPUT_TAG#v}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "release_created=$RELEASE_CREATED"
              echo "tag=$TAG_NAME"
              echo "version=$VERSION"
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux builds are static musl binaries, named for the contract's
          # -unknown-linux-gnu targets: the name says which platform, and a
          # static binary runs on any Linux of that architecture.
          - runner: ubuntu-24.04
            build: x86_64-unknown-linux-musl
            target: x86_64-unknown-linux-gnu
            zig: true
          - runner: ubuntu-24.04
            build: aarch64-unknown-linux-musl
            target: aarch64-unknown-linux-gnu
            zig: true
          - runner: macos-15
            build: aarch64-apple-darwin
            target: aarch64-apple-darwin
            zig: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      BUILD: ${{ matrix.build }}
      TARGET: ${{ matrix.target }}
      ZIG: ${{ matrix.zig }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Check the versions match the tag
        run: |
          version="${TAG#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' tracon-plugin.toml)
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$manifest" != "$version" ] || [ "$crate" != "$version" ]; then
            echo "::error::tag $TAG, tracon-plugin.toml $manifest, Cargo.toml $crate"
            exit 1
          fi
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target "$BUILD"
      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - if: matrix.zig
        run: cargo install cargo-zigbuild --locked --version 0.24.1
      - name: Build
        run: |
          if [ "$ZIG" = "true" ]; then
            cargo zigbuild --locked --release --target "$BUILD"
          else
            cargo build --locked --release --target "$BUILD"
          fi
      - if: matrix.zig
        name: Check the binary is static
        run: |
          file "target/$BUILD/release/sql-review"
          file "target/$BUILD/release/sql-review" | grep -q 'statically linked'
      - name: Package
        run: |
          version="${TAG#v}"
          mkdir -p pkg/bin dist
          cp "target/$BUILD/release/sql-review" pkg/bin/
          cp tracon-plugin.toml pkg/
          tar -C pkg -czf "dist/sql-review-$version-$TARGET.tar.gz" tracon-plugin.toml bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sql-review-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sql-review-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      # release-please created the release when its PR merged; attach the
      # archives to it. --clobber lets a manual re-run replace a partial upload.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
