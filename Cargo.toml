[package]
name = "sql-review"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "Read-only SQL for people and agents: a CLI, an MCP server and a Tracon plugin"
repository = "https://github.com/cosmicspork/sql-review"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
dotenvy = "0.15"
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
oracledb = "=26.0.0-beta.6"
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.43", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = "0.64"
thiserror = "2"
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "io-std", "sync", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.8"
tempfile = "3"
toml = "0.9"

[profile.release]
strip = true
