# Tracon plugin contract v1. The release archive holds this file and
# bin/sql-review; Tracon runs `exec` with --socket <path> --data <dir>.
name = "sql-review"
version = "0.3.0"
contract = 1
exec = ["bin/sql-review", "serve"]
# The database hosts depend on each deployment's credentials, so none are
# declared here.
egress = []

# Read account. A call is lent only the binding its `profile` argument
# names: `sql-read-<profile>`, or `sql-read` when it names none (tracon
# 0.58's `select`; older nodes refuse the key). Fields are the standalone
# DB_* keys (DB_BACKEND, DB_HOST, DB_PORT, DB_SERVICE, DB_USER, DB_PASSWORD,
# DATABASE_URL, ...).
[[credential]]
name = "sql-read"
pattern = "sql-read-*"
select = "profile"

# Write account, lent only to a `write` dispatched from an approved card,
# and only as `sql-write-<profile>`, or `sql-write` for no profile. Same
# DB_* fields: DB_USER/DB_PASSWORD are the write account; connection fields
# left out are sql-read's, and any given must name the same database.
[[credential]]
name = "sql-write"
pattern = "sql-write-*"
lend = "approved"
select = "profile"

[[tool]]
name = "query"
hint = "read"

[[tool]]
name = "describe"
hint = "read"

# Previewed on the read-only account without running it; applied on
# sql-write only once approved, refused as stale if its rows moved.
[[tool]]
name = "write"
hint = "write"
consequential = true
